name: Publish Artifact

on:
  push:
    branches:
      - main
      - development
      - feature/library-remote-publising
  workflow_dispatch:

jobs:
  publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
        continue-on-error: true  # ← There are some network issues with this action.
        timeout-minutes: 2

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean build

      - name: Run tests
        uses: gradle/gradle-build-action@v3
        with:
          arguments: test

      - name: Publish to GitHub Packages
        uses: gradle/gradle-build-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          arguments: publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: published-artifacts
          path: build/libs/*.jar

      - name: Summary
        run: |
          echo "### ✅ Artifact published successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $(grep '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY